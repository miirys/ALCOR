integration-test-vs-code-node-bundle:
  extends:
    - .test
    - .run_when_has_token_or_on_merge_train
    - .turbo-remote-cache
  before_script:
    - apt-get update -qy
    - apt-get install -qy tinyproxy
  script:
    - *bun_install
    - bun run build
    - bun run test:integration
  retry: 2
  variables:
    LSP_COMMAND: node
    LSP_ARGS: './out/main-bundle-node.js --stdio'
    VALIDATE_CI_AND_BUNDLE: true

integration-test-git:
  extends: .test
  script:
    - *bun_install
    - bun run test:integration:git
  variables:
    TEST_GIT_INTEGRATION: true

integration-persistent-storage:
  extends: .test
  script:
    - *bun_install
    - bun run test:integration:persistent-storage
  variables:
    TEST_GIT_INTEGRATION: true

integration-test-browser:
  extends: .test
  stage: test
  needs: []
  allow_failure: true
  variables:
    GITLAB_PROJECT_PATH: 'gitlab-org/editor-extensions/gitlab-lsp'
  before_script:
    # https://pptr.dev/troubleshooting#running-puppeteer-on-gitlabci
    - apt-get update -qy
    - apt-get install -qy gconf-service libasound2 libatk1.0-0 libc6 libcairo2
      libcups2 libdbus-1-3 libexpat1 libfontconfig1 libgbm1 libgcc1 libgconf-2-4
      libgdk-pixbuf2.0-0 libglib2.0-0 libgtk-3-0 libnspr4 libpango-1.0-0
      libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1
      libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1
      libxss1 libxtst6 ca-certificates fonts-liberation libnss3 lsb-release
      xdg-utils wget
  script:
    - *bun_install
    - bun run test:integration:browser

publish_package_artifact:
  extends: .turbo-remote-cache
  stage: deploy
  needs: []
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
  variables:
    TARBALL_NAME: gitlab-lsp.$CI_COMMIT_REF_SLUG.tgz
  script:
    - *bun_install
    - bun run build
    - bun pm pack
    - mv *.tgz "$TARBALL_NAME"
    - TARBALL_URL="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/$TARBALL_NAME"
    - printf "%s\n \n  %s\n \n" "Package successfully built. To install it in another project, e.g. in the VS Code extension, run:" "bun add $TARBALL_URL"
  artifacts:
    when: on_success
    paths:
      - $TARBALL_NAME

publish_binaries_artifact:
  stage: deploy
  needs:
    - job: build-integration-binaries
      artifacts: true
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
  variables:
    TARBALL_NAME: gitlab-lsp.$CI_COMMIT_REF_SLUG.tar.gz
  script:
    - tar -czvf $TARBALL_NAME ./bin
    - TARBALL_URL="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/$TARBALL_NAME"
    - printf "%s\n \n  %s\n \n" "Package successfully built. To download the binaries:" "$TARBALL_URL"
  artifacts:
    when: on_success
    paths:
      - $TARBALL_NAME

publish-nuget-artifact:
  stage: deploy
  allow_failure: true
  image: registry.gitlab.com/gitlab-org/editor-extensions/build-images/mono-nuget
  rules:
    - if: $CI_MERGE_REQUEST_IID
  needs:
    - job: build-integration-binaries
      artifacts: true
  variables:
    PACKAGE_NAME: GitLab.LanguageServer
    PACKAGE_VERSION: 999.0.0
  script:
    - ./scripts/release-nuget.sh --skip-publish --package-name=$PACKAGE_NAME --package-version=$PACKAGE_VERSION
    - PACKAGE_URL="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/$PACKAGE_NAME.$PACKAGE_VERSION.nupkg"
    - printf "%s\n \n  %s\n \n" "Nuget package successfully built. Download it for local installation:" "$PACKAGE_URL"
  dependencies:
    - build-integration-binaries
  artifacts:
    when: on_success
    paths:
      - $PACKAGE_NAME.$PACKAGE_VERSION.nupkg

publish_npm_dry_run:
  stage: deploy
  needs:
    - job: build-integration-binaries
      artifacts: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
  allow_failure: true
  script:
    - *bun_install
    - ./scripts/semantic-release-prepare.sh --dry-run

publish-release::manual:
  extends: .turbo-remote-cache
  interruptible: false
  stage: deploy
  needs:
    - job: build-integration-binaries
      artifacts: true
  variables:
    SENTRY_TRACKING_ENABLED: true
  before_script:
    # Validate that the repository contains a package.json and extract a few values from it.
    - |
      if [[ ! -f package.json ]]; then
        echo "No package.json found! A package.json file is required to publish a package to the registry."
        exit 1
      fi
    - NPM_PACKAGE_NAME=$(bun -e "console.log(require('./package.json').name)")
    - NPM_PACKAGE_VERSION=$(bun -e "console.log(require('./package.json').version)")
    # Validate that the package name is properly scoped to the project's root namespace.
    - |
      if [[ ! $NPM_PACKAGE_NAME =~ ^@$CI_PROJECT_ROOT_NAMESPACE/ ]]; then
        echo "Invalid package scope! Packages must be scoped in the root namespace of the project, e.g. \"@${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_NAME}\""
        exit 1
      fi
  script:
    - bun install --frozen-lockfile
    - PREVIOUS_VERSION=$(bun -e "console.log(require('./package.json').version)")
    - bun run semantic-release -- --repository-url $CI_PROJECT_URL
    - ./scripts/post_deployment_checks.sh --previous-version=$PREVIOUS_VERSION
    - echo "PACKAGE_VERSION=$(bun -e "console.log(require('./package.json').version)")" >> ./build.env
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    paths:
      - ./bin
    reports:
      dotenv: ./build.env # This file is used in the release-nuget job to get the PACKAGE_VERSION variable
  allow_failure: false

release-nuget:
  interruptible: false
  stage: deploy
  image: registry.gitlab.com/gitlab-org/editor-extensions/build-images/mono-nuget
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - job: publish-release::manual
      artifacts: true
  script:
    - ./scripts/release-nuget.sh  --package-version=$PACKAGE_VERSION # $PACKAGE_VERSION is set in the publish-release::manual job

.bun-build:
  extends: .turbo-remote-cache
  before_script:
    - bun install

build_cli_binaries_artifact-unsigned:
  stage: test
  extends:
    - .rg_cache
    - .turbo-remote-cache
  needs: []
  before_script:
    - bun install
  script:
    - bun run cli:compile
    - |
      echo "Stripping Bun's broken Mach-O code signature from macOS binaries..."
      node ./scripts/strip_macho_codesign.js packages/cli/bin/duo-darwin-x64-baseline
  artifacts:
    paths:
      - packages/cli/bin/**/*

build_cli_binaries_artifact:
  extends: .sign_with_cloud_hsm_base
  stage: test
  needs:
    - build_cli_binaries_artifact-unsigned
  script:
    - packages/cli/scripts/sign_executables.sh
  artifacts:
    paths:
      - packages/cli/bin/**/*

publish-duo-cli-artifact:
  stage: deploy
  needs: []
  extends: .bun-build
  rules:
    - if: $CI_MERGE_REQUEST_IID
  script:
    - ./scripts/release-cli.sh --skip-publish
    - PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
    - PACKAGE_URL="$CI_PROJECT_URL/-/jobs/$CI_JOB_ID/artifacts/raw/gitlab-duo-cli-$PACKAGE_VERSION.tgz"
    - printf "%s\n \n  %s\n \n" "Duo cli package successfully built. Download it for local installation:" "$PACKAGE_URL"
  artifacts:
    when: on_success
    paths:
      - gitlab-duo-cli-*.tgz

publish_duo_cli_dry_run:
  stage: deploy
  needs: []
  extends: .bun-build
  rules:
    - if: $CI_MERGE_REQUEST_IID
  allow_failure: true
  script:
    - ./scripts/release-cli.sh --dry-run

publish-duo-cli:
  interruptible: false
  stage: deploy
  extends: .bun-build
  id_tokens:
    NPM_ID_TOKEN:
      aud: 'npm:registry.npmjs.org'
  script:
    - ./scripts/release-cli.sh --package-version=$PACKAGE_VERSION
  needs:
    - job: publish-release::manual
      artifacts: true
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pre-publish_build_cli_binaries-unsigned:
  interruptible: false
  stage: deploy
  extends: build_cli_binaries_artifact-unsigned
  needs:
    - job: publish-release::manual
      artifacts: true
  variables:
    SENTRY_TRACKING_ENABLED: 'true'
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

pre-publish-build_cli_binaries_artifact:
  interruptible: false
  stage: deploy
  extends: build_cli_binaries_artifact
  needs:
    - job: pre-publish_build_cli_binaries-unsigned
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish-duo-cli-binaries:
  interruptible: false
  stage: deploy
  needs:
    - job: pre-publish-build_cli_binaries_artifact
      artifacts: true
    - job: publish-release::manual
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - packages/cli/scripts/publish_executables.sh
