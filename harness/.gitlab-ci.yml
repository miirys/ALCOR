workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        CI_COMMIT_BRANCH: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  REGISTRY_HOST: 'registry.gitlab.com'
  REGISTRY_GROUP: 'gitlab-org'
  CI_NODE_TAG: "0c52cfefa3992c56"
  BUN_INSTALL_CACHE_DIR: '$CI_PROJECT_DIR/.bun-cache'
  SAST_EXCLUDED_PATHS: '.bun-cache'

stages:
  - build
  - validate
  - test
  - deploy

default:
  interruptible: true
  # Pull the ci-node image from the canonical project's public registry so that
  # fork pipelines (e.g. renovate dependency MRs) work even when the fork's own
  # registry is empty. On the canonical project this resolves to the same image.
  image: $REGISTRY_HOST/$REGISTRY_GROUP/editor-extensions/gitlab-lsp/ci-node:$CI_NODE_TAG
  tags:
    - gitlab-org
  artifacts:
    when: on_failure
    expire_in: 1 week
  cache: # Cache modules using lock file
    key:
      files:
        - bun.lock
    paths:
      - .bun-cache/

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - component: ${CI_SERVER_FQDN}/gitlab-org/components/danger-review/danger-review@2.1.0
    inputs:
      job_stage: 'validate'
    rules:
      - if: $CI_MERGE_REQUEST_SOURCE_PROJECT_PATH == "gitlab-org/security/editor-extensions/gitlab-lsp"
        when: never
      - when: always
  - component: ${CI_SERVER_FQDN}/components/code-intelligence/typescript-code-intel@v0.0.3
    inputs:
      language: typescript
      node_version: '20'
  - component: $CI_SERVER_FQDN/gitlab-org/analytics-section/analytics-instrumentation/ci-components/internal_events_validation@v1.0.1
    inputs:
      stage: validate
  - project: 'gitlab-com/gl-security/security-operations/infrastructure-security-public/oidc-modules'
    ref: 3.4.0
    file: templates/gcp_auth.yaml

build-ci-node-image:
  interruptible: false
  image: docker:28.5.2-cli
  services:
    - docker:28.5.2-dind
  variables:
    # TLS disabled for faster DinD startup — matches gitlab-org/gitlab .use-docker-in-docker config
    # See https://gitlab.com/gitlab-org/gitlab/-/blob/master/.gitlab/ci/global.gitlab-ci.yml
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    HEALTHCHECK_TCP_PORT: '2375'
  stage: build
  tags:
    - gitlab-org-docker
  retry: 2
  script:
    - IMAGE_TAG="$CI_REGISTRY_IMAGE/ci-node:$CI_NODE_TAG"
    - |
      # Check if image already exists using GitLab Container Registry API (no Docker daemon needed)
      # The token endpoint is on the GitLab host, not the registry host
      TOKEN=$(wget -q -O - --header "Authorization: Basic $(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64)" \
        "https://${CI_SERVER_HOST}/jwt/auth?service=container_registry&scope=repository:${CI_PROJECT_PATH}/ci-node:pull" \
        | sed 's/.*"token":"\([^"]*\)".*/\1/')
      if [ -n "$TOKEN" ]; then
        if wget -q -O /dev/null --header "Authorization: Bearer $TOKEN" \
          "https://$CI_REGISTRY/v2/${CI_PROJECT_PATH}/ci-node/manifests/$CI_NODE_TAG" 2>/dev/null; then
          echo "Image $IMAGE_TAG already exists, skipping build"
          exit 0
        fi
      fi
      echo "Image not found, building..."
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        docker info >/dev/null 2>&1 && break
        echo "Attempt $i/30: Docker not ready, waiting..."
        sleep 1
      done
      docker info >/dev/null 2>&1 || { echo "Docker daemon failed to start"; exit 1; }
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
    - docker build -f docker/ci-node/Dockerfile -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    - echo "Pushed $IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docker/ci-node/Dockerfile
        - mise/config.toml
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - docker/ci-node/Dockerfile
        - mise/config.toml

verify-ci-node-tag:
  stage: validate
  needs: []
  script:
    - EXPECTED=$(cat docker/ci-node/Dockerfile mise/config.toml | sha256sum | cut -c1-16)
    - |
      if [ "$EXPECTED" != "$CI_NODE_TAG" ]; then
        echo "CI_NODE_TAG mismatch: expected '$EXPECTED', got '$CI_NODE_TAG'"
        echo "Fix: run 'lefthook run pre-commit --force' to update CI_NODE_TAG"
        echo "If the hook was already run, rebase on main — the merge result may include changes to Dockerfile or mise/config.toml from the target branch."
        exit 1
      fi
    - echo "CI_NODE_TAG '$CI_NODE_TAG' matches source files"
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify-bun-lock-format:
  stage: validate
  needs: []
  script:
    - scripts/check_bun_lock_format.sh
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.install dependencies:
  script: &bun_install
    - time bun install --frozen-lockfile

.turbo-remote-cache:
  variables:
    TURBO_API: $TURBO_CACHE_API_URL
    # Must match value in remote cache server for cached artifacts to be usable in builds
    TURBO_REMOTE_CACHE_SIGNATURE_KEY: $TURBO_REMOTE_CACHE_SIGNATURE_KEY
  id_tokens:
    TURBO_TOKEN:
      aud: $TURBO_CACHE_API_URL

no-squash-with-tags:
  stage: 'validate'
  variables:
    FF_ENABLE_BASH_EXIT_CODE_CHECK: true
  script:
    - scripts/no_squash_with_tags.sh

lint_documentation:
  stage: validate
  inherit:
    default: false
  image: registry.gitlab.com/gitlab-org/technical-writing/docs-gitlab-com/lint-markdown:alpine-3.23-vale-3.14.1-markdownlint2-0.22.1-lychee-0.24.2
  script:
    # Lint prose
    - vale --minAlertLevel error docs README.md
    # Lint Markdown
    - markdownlint-cli2 'docs/**/*.md' 'packages/**/*.md' 'src/common/**/*.md' "!**/node_modules/**" "!**/vendor/**" README.md CONTRIBUTING.md
    # Check links
    - lychee --offline --include-fragments --root-dir . docs/**/*.md *.md

lint:
  stage: validate
  script:
    - *bun_install
    - bun run eslint -- --format gitlab
    - bun run prettier
  artifacts:
    reports:
      codequality: gl-code-quality-report.json

lint_commit:
  stage: validate
  script:
    - apt-get update && apt-get install -y git
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME $CI_COMMIT_SHA
    - cd scripts/commit-lint && bun install --frozen-lockfile
    - ./lint.sh
  rules:
    - if: '$CI_MERGE_REQUEST_TITLE =~ /^Draft:/'
      when: never
    - if: '$CI_MERGE_REQUEST_IID && $CI_PROJECT_VISIBILITY == "public"' # lint.js script makes an API call without authentication
      when: always

verify-cli-docs:
  stage: validate
  needs: []
  script:
    - *bun_install
    - |
      if ! bun --conditions=_ts-source packages/cli/scripts/gen_docs.ts --check; then
        echo "packages/cli/docs/cli-reference.md is out of date."
        echo "Fix: run 'bun run --filter @gitlab/duo-cli docs' (or 'lefthook run pre-commit --force') and commit the result."
        exit 1
      fi
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

verify-api-extractor-config:
  stage: validate
  needs: []
  script:
    - *bun_install
    - bun scripts/generate_api_extractor_config.ts
    - |
      if ! git diff --exit-code api-extractor.json; then
        echo "api-extractor.json is out of date (workspace packages changed)."
        echo "Fix: run 'bun scripts/generate_api_extractor_config.ts' and commit the result."
        exit 1
      fi
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

typescript-compiles:
  extends: .turbo-remote-cache
  stage: validate
  script:
    - *bun_install
    - bun run compile

typescript-compile-scripts:
  stage: validate
  script:
    - *bun_install
    - bun run compile:scripts

typescript-compile-integration:
  stage: validate
  script:
    - *bun_install
    - bun run compile:integration

.test:
  stage: test
  needs: []
  artifacts:
    when: always
    reports:
      junit: reports/unit.xml
      coverage_report:
        coverage_format: cobertura
        path: reports/cobertura-coverage.xml

unit-tests:
  extends: .test
  script:
    - *bun_install
    - ./scripts/run_test_and_detect_open_handles.sh

cli-tests:
  stage: test
  needs: []
  script:
    - *bun_install
    - bun run test:cli

cli-headless-e2e-test:
  stage: test
  needs:
    - job: build_cli_binaries_artifact-unsigned
      artifacts: true
  image: registry.gitlab.com/gitlab-org/duo-workflow/default-docker-image/workflow-generic-image:v0.0.6
  variables:
    GITLAB_AUTH_TOKEN: $GITLAB_TEST_TOKEN
    DUO_CLI_BINARY_PATH: packages/cli/bin/duo-linux-x64
  before_script:
    - yum install -y unzip
    - BUN_VERSION="bun-v$(sed -nE 's/^bun = "([^"]+)".*/\1/p' mise/config.toml)"
    - curl -fsSL https://bun.sh/install | bash -s "$BUN_VERSION"
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - test -x "$DUO_CLI_BINARY_PATH" || { echo "Pre-built binary missing at $DUO_CLI_BINARY_PATH"; exit 1; }
    - bun install --frozen-lockfile
  script:
    - bun -i packages/cli/scripts/test-headless-in-docker/run-in-ci.ts
  rules:
    - if: $CI_MERGE_REQUEST_IID

cli-e2e-test:
  extends:
    - .test
    - .run_when_has_token_or_on_merge_train
    - .turbo-remote-cache
  stage: test
  needs: []
  variables:
    ASCIINEMA_SERVER_URL: 'https://asciinema.duo-cli-testing.com/'
  before_script:
    - *bun_install
    - mkdir -p ~/.local/state/asciinema
    - echo "$ASCIINEMA_INSTALL_ID" > ~/.local/state/asciinema/install-id
  script:
    - git remote set-url origin https://gitlab.com/gitlab-org/editor-extensions/gitlab-lsp.git
    - bun run --filter @gitlab/duo-cli test:e2e

# The cert/proxy network e2e suite is run once per CLI runtime so both the
# Node.js bundle and the Bun-compiled binary exercise the cert/proxy/WebSocket
# code paths we ship to customers. The two jobs run in parallel. The Bun job
# consumes the prebuilt binary artifact instead of recompiling it.
# See docs/ai/cert-proxy.md § "CI Integration".
cli-network-e2e-node:
  extends:
    - .run_when_has_token_or_on_merge_train
    - .turbo-remote-cache
  stage: test
  needs: []
  before_script:
    - *bun_install
  script:
    - bun run --filter @gitlab/duo-cli test:network-e2e:node
  retry: 1
  allow_failure: true # remove once stable in CI

cli-network-e2e-bun:
  extends:
    - .run_when_has_token_or_on_merge_train
    - .turbo-remote-cache
  stage: test
  # The compiled binary is standalone (Bun-embedded) and runs without a
  # separate Bun install. The default ci-node image still provides the pinned
  # Bun (mise/config.toml) for `bun run` + tmux for the terminal harness.
  needs:
    - job: build_cli_binaries_artifact-unsigned
      artifacts: true
  variables:
    # getCompiledBinaryPath() resolves bin/duo-linux-x64 on linux x64.
    DUO_CLI_BINARY_PATH: packages/cli/bin/duo-linux-x64
  before_script:
    - test -x "$DUO_CLI_BINARY_PATH" || { echo "Pre-built binary missing at $DUO_CLI_BINARY_PATH"; exit 1; }
    - *bun_install
  script:
    - bun run --filter @gitlab/duo-cli test:network-e2e:bun
  retry: 1
  allow_failure: true # remove once stable in CI

