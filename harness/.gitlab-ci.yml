ui-test-unified-webview:
  extends: .test
  image: mcr.microsoft.com/playwright:v1.59.1-noble
  before_script:
    - apt-get update -qy && apt-get install -qy unzip curl
    - BUN_VERSION="bun-v$(sed -nE 's/^bun = "([^"]+)".*/\1/p' mise/config.toml)"
    - curl -fsSL https://bun.sh/install | bash -s "$BUN_VERSION"
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - bun install --frozen-lockfile
  script:
    - bun run test:storybook:webview

unit-test-unified-webview:
  extends: .test
  script:
    - *bun_install
    - bun run test:unit:webview

# This set of rules skips a job if the GITLAB_TEST_TOKEN is not defined and
# the pipeline doesn't run in merge train. This is useful for community contributors/renovate fork
.run_when_has_token_or_on_merge_train:
  rules:
    - if: $GITLAB_TEST_TOKEN || $CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"

.sign_with_cloud_hsm_base:
  image: ${CI_REGISTRY}/gitlab-com/gl-infra/common-ci-tasks-images/code-signer:1.3.0
  extends: .google-oidc:auth
  variables:
    GCLOUD_PROJECT: gitlab-ci-runners-signing
    SERVICE_ACCOUNT: gitlab-lsp-signer@gitlab-ci-runners-signing.iam.gserviceaccount.com
    WI_POOL_PROVIDER: //iam.googleapis.com/projects/8522242139/locations/global/workloadIdentityPools/gitlab-pool-oidc-$CI_PROJECT_ID/providers/gitlab-jwt-$CI_PROJECT_ID

.rg_cache:
  cache:
    key:
      files:
        - bun.lock
      prefix: rg-binaries-v1
    paths:
      - rg-binaries/
    policy: pull-push

build-integration-binaries-unsigned:
  stage: test
  extends:
    - .rg_cache
    - .turbo-remote-cache
  needs: []
  script:
    - *bun_install
    - bun run build
    - ./scripts/package.sh
    - |
      echo "Stripping Bun's broken Mach-O code signature from macOS binaries..."
      node ./scripts/strip_macho_codesign.js bin/gitlab-lsp-macos-x64
  artifacts:
    paths:
      - bin/**/*
      - out/**/*

build-integration-binaries:
  extends: .sign_with_cloud_hsm_base
  stage: test
  needs:
    - build-integration-binaries-unsigned
  script:
    - |
      if [[ "$CI_COMMIT_REF_PROTECTED" == "true" && "$CI_SERVER_HOST" == "gitlab.com" &&
          ("$CI_PROJECT_PATH" == "gitlab-org/editor-extensions/gitlab-lsp" ||
          "$CI_PROJECT_PATH" == "gitlab-org/security/editor-extensions/gitlab-lsp") ]]; then
        echo "Signing Windows binaries..."
        sign-windows-binaries --overwrite bin/gitlab-lsp-win-x64.exe bin/gitlab-lsp-win-arm64.exe
        echo "Signing and notarizing macOS binaries..."
        sign-macos-binaries --rcodesign-args "--entitlements-xml-file ./macos-entitlements.xml" --overwrite bin/gitlab-lsp-macos-arm64 bin/gitlab-lsp-macos-x64
      else
        echo "Signing binaries only with macOS entitlements..."
        rcodesign sign bin/gitlab-lsp-macos-arm64 --code-signature-flags runtime --entitlements-xml-file ./macos-entitlements.xml
        rcodesign sign bin/gitlab-lsp-macos-x64 --code-signature-flags runtime --entitlements-xml-file ./macos-entitlements.xml
      fi
  artifacts:
    paths:
      - bin/**/*
      - out/**/*

integration-test-binaries-linux:
  extends: .test
  stage: test
  needs:
    - build-integration-binaries
  before_script:
    - apt-get update -qy
    - apt-get install -qy tinyproxy
  script:
    - node -v
    - *bun_install
    - bun run test:integration
  variables:
    LSP_COMMAND: ./bin/gitlab-lsp-linux-x64
    LSP_ARGS: '--stdio'

# macOS-gated: shared Linux runners reject SRT's bubblewrap (capability-stripped userns).
integration-test-sandbox-macos:
  stage: test
  needs: []
  cache: []
  tags:
    - saas-macos-medium-m1
  image: macos-15-xcode-16
  before_script:
    # macOS runners ship node + brew but not bun; install it for this job.
    - curl -fsSL https://bun.sh/install | bash
    - export PATH="$HOME/.bun/bin:$PATH"
  script:
    - bun install --frozen-lockfile
    - bun run test:integration:sandbox
  retry: 1

